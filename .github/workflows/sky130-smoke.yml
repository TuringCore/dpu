name: sky130-signoff-smoke

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run RTL simulation
        run: make sim

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
      - name: Verify formal tools
        run: |
          yosys -V
          sby --version
      - name: Run formal checks
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          make formal

  synthesis-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker
        run: docker --version
      - name: OpenLane smoke check
        run: |
          docker run --rm -v "$(pwd):/work" -w /work \
            efabless/openlane:latest \
            sh -lc "cd /work && openlane --run_file openlane/config.json"
