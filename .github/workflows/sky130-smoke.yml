name: sky130-smoke

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: make sim

  formal:
    name: formal (prove + cover)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - name: Formal verification (SymbiYosys prove + cover)
        run: |
          set -o pipefail
          make formal 2>&1 | tee formal.log
      - name: Report result in job summary
        if: always()
        run: |
          {
            echo "### Formal verification (Yosys/SymbiYosys)"
            if [ "$(grep -c "DONE (PASS" formal.log)" -ge 2 ]; then echo "**PASS**"; else echo "**FAIL**"; fi
            echo '```'
            grep -Ei "summary|DONE|assert|cover|Status" formal.log | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-output
          path: |
            formal.log
            formal/dpu_tile/
            formal/dpu_tile_cover/
          if-no-files-found: ignore

  synthesis-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Yosys synthesis (no Docker, PDK-agnostic)
        run: make sky130-synth-yosys-only

  lint:
    name: RTL lint (Verilator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint RTL
        run: verilator --lint-only --Wall --top-module dpu_tile rtl/dpu_tile.sv

  perf:
    name: perf (latency / throughput / area / workload scorecard)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Performance scorecard
        run: make perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-output
          path: build/perf/
          if-no-files-found: ignore
