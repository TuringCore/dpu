name: sky130-signoff-smoke

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run RTL simulation
        run: make sim

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys, Boolector, and SymbiYosys
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys boolector
          git init "$RUNNER_TEMP/sby"
          git -C "$RUNNER_TEMP/sby" fetch --depth 1 https://github.com/YosysHQ/sby.git b1a1e98cba941ec8433f8dc27f416cd7bb7f14be
          git -C "$RUNNER_TEMP/sby" checkout --detach FETCH_HEAD
          sudo make -C "$RUNNER_TEMP/sby" install
          yosys -V
          sby --version
      - name: Run formal checks
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          make formal

  synthesis-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker
        run: docker --version
      - name: OpenLane smoke check
        run: |
          docker run --rm -v "$(pwd):/work" -w /work \
            efabless/openlane:latest \
            sh -lc "cd /work && openlane --run_file openlane/config.json"
